name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml', 'index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'data/**', 'icons/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }} # secrets can't be read in a step's "if", job env can
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Install SDK platform 36 (runner ships the SDK and sdkmanager)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Restore the private Play upload keystore (repo secrets; skipped on forks)
        if: ${{ env.UPLOAD_KEYSTORE_B64 != '' }}
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build release APK (sideloading) and AAB (Google Play upload)
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: doku-puppies-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Publish as "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Doku Puppies Android app (latest build)
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          body: |
            Phones and tablets: open this page on the device and install the APK (allow installs from your browser when asked).
            Android TV / Google TV: sideload with Downloader by AFTVnews or `adb install`.
            `app-release.aab` is the bundle to upload to Google Play (see store/listing.md).

  emulator-test:
    name: Emulator test (offline first run, captive portal, online)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Install SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build debug APK (honours the test's URL override and allows cleartext to the local server)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator (android/emulator-test/run.sh)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/emulator-test/run.sh android/app/build/outputs/apk/debug/app-debug.apk emulator-test-out
      - name: Keep the screenshots, UI dumps, request log and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test
          path: emulator-test-out
