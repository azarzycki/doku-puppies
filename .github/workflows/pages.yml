name: Deploy Pupdoku to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['index.html', 'css/**', 'js/**', 'data/**', 'icons/**', 'sw.js', 'manifest.webmanifest', 'apk/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the service worker cache version with the commit
        run: sed -i "s/const VERSION = 'pupdoku-v1';/const VERSION = 'pupdoku-${GITHUB_SHA::8}';/" sw.js
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
